<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Squared Away — CIS Tax & Expenses</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0D1B2A;
      --navy-mid: #162437;
      --navy-light: #1E3048;
      --teal: #00B894;
      --teal-dim: #00926f;
      --teal-glow: rgba(0,184,148,0.12);
      --cream: #FAF9F6;
      --text: #E8EDF2;
      --text-muted: #7A93AE;
      --danger: #E05252;
      --warning: #F0A500;
      --border: rgba(255,255,255,0.07);
      --radius: 12px;
      --radius-sm: 8px;
    }

    html, body, #root {
      height: 100%;
      background: var(--navy);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── AUTH SCREEN ── */
    .auth-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at 50% 0%, rgba(0,184,148,0.08) 0%, transparent 70%);
    }
    .auth-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--cream);
      margin-bottom: 4px;
    }
    .auth-logo span { color: var(--teal); }
    .auth-tagline { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 36px; letter-spacing: 0.08em; text-transform: uppercase; }
    .auth-card {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      width: 100%;
      max-width: 400px;
    }
    .auth-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
    .field input {
      width: 100%;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--teal); }
    .btn-primary {
      width: 100%;
      background: var(--teal);
      color: var(--navy);
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
    }
    .btn-primary:hover { background: #00d4a8; }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-switch { margin-top: 20px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    .auth-switch button { background: none; border: none; color: var(--teal); cursor: pointer; font-size: 0.85rem; }
    .error-msg { background: rgba(224,82,82,0.12); border: 1px solid rgba(224,82,82,0.3); border-radius: var(--radius-sm); padding: 10px 14px; color: #f08080; font-size: 0.85rem; margin-bottom: 16px; }
    .success-msg { background: var(--teal-glow); border: 1px solid rgba(0,184,148,0.3); border-radius: var(--radius-sm); padding: 10px 14px; color: var(--teal); font-size: 0.85rem; margin-bottom: 16px; }

    /* ── LAYOUT ── */
    .app-layout { display: flex; height: 100vh; overflow: hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width: 220px;
      min-width: 220px;
      background: var(--navy-mid);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 24px 0 16px;
    }
    .sidebar-logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--cream);
      padding: 0 20px 24px;
      letter-spacing: 0.03em;
    }
    .sidebar-logo span { color: var(--teal); }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 20px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      font-weight: 500;
      border-left: 3px solid transparent;
      transition: all 0.15s;
    }
    .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .nav-item.active { color: var(--teal); border-left-color: var(--teal); background: var(--teal-glow); }
    .nav-icon { font-size: 1.1rem; width: 20px; text-align: center; }
    .sidebar-bottom { margin-top: auto; padding: 16px 20px 0; border-top: 1px solid var(--border); }
    .plan-badge {
      display: inline-block;
      background: var(--teal-glow);
      color: var(--teal);
      border: 1px solid rgba(0,184,148,0.3);
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }
    .sidebar-user { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-signout { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 7px 12px; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; width: 100%; transition: all 0.15s; }
    .btn-signout:hover { color: var(--text); border-color: rgba(255,255,255,0.15); }

    /* ── MAIN CONTENT ── */
    .main-content { flex: 1; overflow-y: auto; padding: 28px 32px; }
    .page-header { margin-bottom: 28px; }
    .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 700; letter-spacing: 0.02em; }
    .page-sub { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }

    /* ── CARDS ── */
    .card {
      background: var(--navy-mid);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }
    .card-title { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .card-value { font-family: 'Barlow Condensed', sans-serif; font-size: 2rem; font-weight: 700; }
    .card-value.teal { color: var(--teal); }
    .card-value.danger { color: var(--danger); }
    .card-value.warning { color: var(--warning); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

    /* ── TABLE ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; padding: 10px 12px; border-bottom: 1px solid var(--border); font-weight: 500; }
    td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }
    .badge {
      display: inline-block;
      border-radius: 20px;
      padding: 2px 9px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge-teal { background: var(--teal-glow); color: var(--teal); }
    .badge-warn { background: rgba(240,165,0,0.12); color: var(--warning); }
    .badge-danger { background: rgba(224,82,82,0.12); color: var(--danger); }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      border: none;
      font-family: 'Inter', sans-serif;
    }
    .btn-teal { background: var(--teal); color: var(--navy); }
    .btn-teal:hover { background: #00d4a8; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .btn-danger { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.2); color: var(--danger); }
    .btn-danger:hover { background: rgba(224,82,82,0.2); }
    .btn-sm { padding: 6px 12px; font-size: 0.8rem; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal {
      background: var(--navy-mid);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 20px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 24px; justify-content: flex-end; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* ── TAX SUMMARY ── */
    .tax-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .tax-row:last-child { border-bottom: none; }
    .tax-label { color: var(--text-muted); font-size: 0.9rem; }
    .tax-val { font-weight: 600; font-size: 0.95rem; }
    .tax-total { display: flex; justify-content: space-between; align-items: center; padding: 18px 20px; border-radius: var(--radius-sm); margin-top: 16px; }
    .tax-total.refund { background: var(--teal-glow); border: 1px solid rgba(0,184,148,0.25); }
    .tax-total.owed { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.2); }
    .tax-total-label { font-weight: 600; }
    .tax-total-val { font-family: 'Barlow Condensed', sans-serif; font-size: 1.8rem; font-weight: 700; }

    /* ── PAYWALL ── */
    .paywall-banner {
      background: linear-gradient(135deg, var(--navy-light), rgba(0,184,148,0.06));
      border: 1px solid rgba(0,184,148,0.2);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
    }
    .paywall-banner h3 { font-size: 1rem; margin-bottom: 8px; }
    .paywall-banner p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 16px; }

    /* ── PROFILE ── */
    .profile-section { margin-bottom: 24px; }
    .profile-section h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }
    .profile-field { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .profile-field:last-child { border-bottom: none; }
    .profile-field-label { color: var(--text-muted); font-size: 0.85rem; }
    .profile-field-val { font-size: 0.9rem; font-weight: 500; }
    .plan-card { border-radius: var(--radius); padding: 20px; border: 2px solid transparent; cursor: pointer; transition: all 0.2s; margin-bottom: 12px; }
    .plan-card.active { border-color: var(--teal); background: var(--teal-glow); }
    .plan-card:not(.active) { background: var(--navy-light); border-color: var(--border); }
    .plan-name { font-weight: 700; font-size: 1rem; }
    .plan-price { font-family: 'Barlow Condensed', sans-serif; font-size: 1.4rem; color: var(--teal); }
    .plan-features { list-style: none; margin-top: 12px; }
    .plan-features li { font-size: 0.82rem; color: var(--text-muted); padding: 3px 0; }
    .plan-features li::before { content: '✓ '; color: var(--teal); }

    /* ── QUICK ADD BUTTONS ── */
    .quick-adds { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 48px 24px; color: var(--text-muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .empty-state h3 { color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 0.85rem; }

    /* ── MOBILE NAV ── */
    .mobile-nav {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: var(--navy-mid);
      border-top: 1px solid var(--border);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 50;
    }
    .mobile-nav-items { display: flex; justify-content: space-around; }
    .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 12px; cursor: pointer; color: var(--text-muted); font-size: 0.65rem; border: none; background: none; }
    .mobile-nav-item.active { color: var(--teal); }
    .mobile-nav-item .icon { font-size: 1.3rem; }
    .mobile-header { display: none; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .mobile-nav { display: block; }
      .mobile-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 20px;
        background: var(--navy-mid);
        border-bottom: 1px solid var(--border);
        position: sticky; top: 0; z-index: 40;
      }
      .mobile-header-logo { font-family: 'Barlow Condensed', sans-serif; font-size: 1.3rem; font-weight: 800; }
      .mobile-header-logo span { color: var(--teal); }
      .main-content { padding: 20px 16px 90px; }
      .grid-4 { grid-template-columns: 1fr 1fr; }
      .grid-2 { grid-template-columns: 1fr; }
      .form-row { grid-template-columns: 1fr; }
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    select {
      width: 100%;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      cursor: pointer;
    }
    select:focus { border-color: var(--teal); }
    textarea {
      width: 100%;
      background: var(--navy-light);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      resize: vertical;
      min-height: 80px;
    }
    textarea:focus { border-color: var(--teal); }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .note { font-size: 0.8rem; color: var(--text-muted); font-style: italic; padding: 12px 14px; background: rgba(255,255,255,0.03); border-radius: var(--radius-sm); border-left: 3px solid var(--teal); }

    .loading { display: flex; align-items: center; justify-content: center; height: 200px; color: var(--text-muted); }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── SUPABASE CONFIG ───────────────────────────────────────────────────────
// Replace these with your actual Supabase project URL and anon key
const SUPABASE_URL = 'https://smtqpnmxldstrqvvjqag.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_QA17ilYnRjRSYl6aJ9EkLQ_Fx5rOscY';

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ─── HELPERS ──────────────────────────────────────────────────────────────
const fmt = (n) => '£' + (Number(n) || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmtMiles = (n) => (Number(n) || 0).toFixed(1) + ' mi';
const currentYear = () => new Date().getFullYear();
const currentTaxYear = () => {
  const now = new Date();
  const y = now.getFullYear();
  return now.getMonth() >= 3 ? `${y}/${y+1}` : `${y-1}/${y}`;
};

// Tax calculation helpers (UK self-employed, simplified)
const calcTax = ({ income, expenses, mileageClaim, cisDeducted }) => {
  const taxableProfit = Math.max(0, income - expenses - mileageClaim);
  const personalAllowance = 12570;
  const taxable = Math.max(0, taxableProfit - personalAllowance);
  const basicRate = Math.min(taxable, 37700);
  const higherRate = Math.max(0, taxable - 37700);
  const incomeTax = basicRate * 0.20 + higherRate * 0.40;
  const ni = Math.max(0, (taxableProfit - 12570) * 0.09);
  const totalBill = incomeTax + ni;
  const balance = cisDeducted - totalBill;
  return { taxableProfit, incomeTax, ni, totalBill, balance };
};

const EXPENSE_CATEGORIES = [
  'Tools & Equipment', 'Materials', 'PPE & Workwear', 'Vehicle & Fuel',
  'Phone & Internet', 'Insurance', 'Training & Certification', 'Accommodation',
  'Subcontractors', 'Office & Admin', 'Other'
];

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────
function AuthScreen({ onAuth }) {
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [success, setSuccess] = useState('');

  const handle = async () => {
    setError(''); setSuccess(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onAuth(data.user);
      } else if (mode === 'signup') {
        const { data, error } = await supabase.auth.signUp({ email, password });
        if (error) throw error;
        setSuccess('Account created! Check your email to confirm, then sign in.');
        setMode('login');
      } else {
        const { error } = await supabase.auth.resetPasswordForEmail(email);
        if (error) throw error;
        setSuccess('Password reset email sent.');
      }
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="auth-wrap">
      <div className="auth-logo">SQUARED <span>AWAY</span></div>
      <div className="auth-tagline">CIS Tax & Expenses</div>
      <div className="auth-card">
        <div className="auth-title">
          {mode === 'login' ? 'Sign in' : mode === 'signup' ? 'Create account' : 'Reset password'}
        </div>
        {error && <div className="error-msg">{error}</div>}
        {success && <div className="success-msg">{success}</div>}
        <div className="field">
          <label>Email</label>
          <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" />
        </div>
        {mode !== 'reset' && (
          <div className="field">
            <label>Password</label>
            <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" onKeyDown={e => e.key === 'Enter' && handle()} />
          </div>
        )}
        <button className="btn-primary" onClick={handle} disabled={loading}>
          {loading ? 'Please wait…' : mode === 'login' ? 'Sign in' : mode === 'signup' ? 'Create account' : 'Send reset email'}
        </button>
        <div className="auth-switch">
          {mode === 'login' && <>No account? <button onClick={() => { setError(''); setMode('signup'); }}>Sign up free</button></>}
          {mode === 'signup' && <>Already got one? <button onClick={() => { setError(''); setMode('login'); }}>Sign in</button></>}
          {mode !== 'reset' && <> · <button onClick={() => { setError(''); setMode('reset'); }}>Forgot password?</button></>}
          {mode === 'reset' && <><button onClick={() => { setError(''); setMode('login'); }}>Back to sign in</button></>}
        </div>
      </div>
    </div>
  );
}

// ─── MODAL WRAPPER ────────────────────────────────────────────────────────
function Modal({ title, onClose, children }) {
  return (
    <div className="modal-overlay" onClick={e => e.target === e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-title">{title}</div>
        {children}
      </div>
    </div>
  );
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────
function Dashboard({ user, profile, data, onAdd }) {
  const { income, expenses, mileage, cis } = data;
  const totalIncome = cis.reduce((s, r) => s + (r.gross || 0), 0);
  const totalExpenses = expenses.reduce((s, r) => s + (r.amount || 0), 0);
  const totalMiles = mileage.reduce((s, r) => s + (r.miles || 0), 0);
  const mileageClaim = totalMiles * 0.45;
  const totalCIS = cis.reduce((s, r) => s + (r.deduction || 0), 0);
  const { taxableProfit, totalBill, balance } = calcTax({ income: totalIncome, expenses: totalExpenses, mileageClaim, cisDeducted: totalCIS });

  const recentExpenses = [...expenses].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Dashboard</div>
        <div className="page-sub">Tax year {currentTaxYear()} — {profile?.trade || 'Self-employed subcontractor'}</div>
      </div>

      <div className="quick-adds">
        <button className="btn btn-teal" onClick={() => onAdd('expense')}>+ Log Expense</button>
        <button className="btn btn-ghost" onClick={() => onAdd('mileage')}>+ Add Mileage</button>

// ─── CIS RECORDS ──────────────────────────────────────────────────────────
function CISRecords({ user, profile, cis, onRefresh, initialModal }) {
  const [showModal, setShowModal] = useState(!!initialModal);
  const [form, setForm] = useState({ date: new Date().toISOString().split('T')[0], contractor: '', gross: '', deduction: '', verified: false });
  const [loading, setLoading] = useState(false);

  useEffect(() => { if (initialModal) setShowModal(true); }, [initialModal]);

  const net = (r) => (r.gross || 0) - (r.deduction || 0);

  const save = async () => {
    if (!form.gross || !form.contractor) return;
    setLoading(true);
    const gross = parseFloat(form.gross);
    const deduction = form.deduction ? parseFloat(form.deduction) : gross * 0.20;
    await supabase.from('cis_records').insert({ user_id: user.id, ...form, gross, deduction });
    setLoading(false);
    setShowModal(false);
    setForm({ date: new Date().toISOString().split('T')[0], contractor: '', gross: '', deduction: '', verified: false });
    onRefresh();
  };

  const del = async (id) => {
    await supabase.from('cis_records').delete().eq('id', id);
    onRefresh();
  };

  const isPro = profile?.plan === 'Pro' || profile?.plan === 'Elite';
  const limit = isPro ? Infinity : 3;
  const canAdd = cis.length < limit;

  const totals = cis.reduce((s, r) => ({ gross: s.gross + (r.gross||0), deduction: s.deduction + (r.deduction||0) }), {gross:0,deduction:0});

  return (
    <div>
      <div className="page-header" style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
        <div>
          <div className="page-title">CIS Records</div>
          <div className="page-sub">Track your CIS deductions per contractor</div>
        </div>
        <button className="btn btn-teal" onClick={() => canAdd && setShowModal(true)} disabled={!canAdd}>+ Add Record</button>
      </div>

      {!isPro && (
        <div className="paywall-banner">
          <h3>Free plan: up to 3 contractors</h3>
          <p>Upgrade to Pro to log unlimited CIS records across all your contractors.</p>
          <button className="btn btn-teal">Upgrade to Pro — £7.99/mo</button>
        </div>
      )}

      <div className="grid-4" style={{gridTemplateColumns:'repeat(3,1fr)'}}>
        <div className="card"><div className="card-title">Total Gross</div><div className="card-value">{fmt(totals.gross)}</div></div>
        <div className="card"><div className="card-title">CIS Deducted</div><div className="card-value danger">{fmt(totals.deduction)}</div></div>
        <div className="card"><div className="card-title">Net Received</div><div className="card-value teal">{fmt(totals.gross - totals.deduction)}</div></div>
      </div>

      <div className="card">
        {cis.length === 0 ? (
          <div className="empty-state">
            <div className="icon">🏗️</div>
            <h3>No CIS records yet</h3>
            <p>Log payments from your contractors — gross amount and CIS deduction.</p>
          </div>
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Contractor</th><th>Gross</th><th>Deduction</th><th>Net</th><th>Verified</th><th></th></tr></thead>
              <tbody>
                {[...cis].sort((a,b) => new Date(b.date)-new Date(a.date)).map(r => (
                  <tr key={r.id}>
                    <td style={{color:'var(--text-muted)',fontSize:'0.82rem'}}>{r.date}</td>
                    <td>{r.contractor}</td>
                    <td>{fmt(r.gross)}</td>
                    <td style={{color:'var(--danger)'}}>{fmt(r.deduction)}</td>
                    <td style={{color:'var(--teal)',fontWeight:600}}>{fmt(net(r))}</td>
                    <td><span className={`badge ${r.verified ? 'badge-teal' : 'badge-warn'}`}>{r.verified ? 'Yes' : 'No'}</span></td>
                    <td><button className="btn btn-danger btn-sm" onClick={() => del(r.id)}>✕</button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {showModal && (
        <Modal title="Add CIS Record" onClose={() => setShowModal(false)}>
          <div className="field"><label>Date</label><input type="date" value={form.date} onChange={e => setForm({...form,date:e.target.value})} /></div>
          <div className="field"><label>Contractor Name</label><input type="text" value={form.contractor} onChange={e => setForm({...form,contractor:e.target.value})} placeholder="e.g. BuildCo Ltd" /></div>
          <div className="form-row">
            <div className="field"><label>Gross Payment (£)</label><input type="number" step="0.01" min="0" value={form.gross} onChange={e => setForm({...form,gross:e.target.value})} placeholder="0.00" /></div>
            <div className="field"><label>CIS Deduction (£)</label><input type="number" step="0.01" min="0" value={form.deduction} onChange={e => setForm({...form,deduction:e.target.value})} placeholder="Auto: 20%" /></div>
          </div>
          {form.gross && <div className="note">Net you'll receive: {fmt((parseFloat(form.gross)||0) - (parseFloat(form.deduction) || (parseFloat(form.gross)||0)*0.20))}</div>}
          <div className="field" style={{display:'flex',alignItems:'center',gap:10,marginTop:4}}>
            <input type="checkbox" id="verified" checked={form.verified} onChange={e => setForm({...form,verified:e.target.checked})} style={{width:'auto'}} />
            <label htmlFor="verified" style={{textTransform:'none',letterSpacing:0,fontSize:'0.9rem',color:'var(--text)'}}>CIS statement received from contractor</label>
          </div>
          <div className="modal-actions">
            <button className="btn btn-ghost" onClick={() => setShowModal(false)}>Cancel</button>
            <button className="btn btn-teal" onClick={save} disabled={loading}>{loading ? 'Saving…' : 'Save Record'}</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── TAX SUMMARY ─────────────────────────────────────────────────────────
function TaxSummary({ user, profile, data }) {
  const { expenses, mileage, cis } = data;
  const totalIncome = cis.reduce((s, r) => s + (r.gross || 0), 0);
  const totalExpenses = expenses.reduce((s, r) => s + (r.amount || 0), 0);
  const totalMiles = mileage.reduce((s, r) => s + (r.miles || 0), 0);
  const mileageClaim = totalMiles * 0.45;
  const cisDeducted = cis.reduce((s, r) => s + (r.deduction || 0), 0);
  const { taxableProfit, incomeTax, ni, totalBill, balance } = calcTax({ income: totalIncome, expenses: totalExpenses, mileageClaim, cisDeducted });

  const isPro = profile?.plan === 'Pro' || profile?.plan === 'Elite';
  const isElite = profile?.plan === 'Elite';

  return (
    <div>
      <div className="page-header">
        <div className="page-title">Tax Summary</div>
        <div className="page-sub">Estimated position for tax year {currentTaxYear()}</div>
      </div>

      <div className="grid-2">
        <div className="card">
          <div className="card-title" style={{marginBottom:8}}>Income & Deductions</div>
          <div className="tax-row"><span className="tax-label">Gross Income (CIS)</span><span className="tax-val">{fmt(totalIncome)}</span></div>
          <div className="tax-row"><span className="tax-label">Business Expenses</span><span className="tax-val" style={{color:'var(--danger)'}}>− {fmt(totalExpenses)}</span></div>
          <div className="tax-row"><span className="tax-label">Mileage Claim ({fmtMiles(totalMiles)})</span><span className="tax-val" style={{color:'var(--danger)'}}>− {fmt(mileageClaim)}</span></div>
          <div className="tax-row"><span className="tax-label">Taxable Profit</span><span className="tax-val" style={{fontWeight:700}}>{fmt(taxableProfit)}</span></div>
        </div>

        <div className="card">
          <div className="card-title" style={{marginBottom:8}}>Tax Calculation</div>
          {isPro ? (
            <>
              <div className="tax-row"><span className="tax-label">Personal Allowance</span><span className="tax-val">£12,570</span></div>
              <div className="tax-row"><span className="tax-label">Income Tax</span><span className="tax-val" style={{color:'var(--danger)'}}>{fmt(incomeTax)}</span></div>
              <div className="tax-row"><span className="tax-label">Class 4 NI (9%)</span><span className="tax-val" style={{color:'var(--danger)'}}>{fmt(ni)}</span></div>
              <div className="tax-row"><span className="tax-label">Total Tax Bill</span><span className="tax-val" style={{fontWeight:700}}>{fmt(totalBill)}</span></div>
              <div className="tax-row"><span className="tax-label">CIS Already Deducted</span><span className="tax-val" style={{color:'var(--teal)'}}>{fmt(cisDeducted)}</span></div>
            </>
          ) : (
            <div className="paywall-banner" style={{textAlign:'left',padding:16,marginBottom:0}}>
              <h3 style={{marginBottom:6}}>Full breakdown on Pro</h3>
              <p>See your income tax, NI, and exact CIS position line by line.</p>
              <button className="btn btn-teal btn-sm" style={{marginTop:8}}>Upgrade — £7.99/mo</button>
            </div>
          )}
        </div>
      </div>

      <div className={`tax-total ${balance >= 0 ? 'refund' : 'owed'}`}>
        <div>
          <div className="tax-total-label">{balance >= 0 ? '🎉 Estimated Refund' : '⚠️ Estimated Tax Owed'}</div>
          <div style={{fontSize:'0.8rem',color:'var(--text-muted)',marginTop:4}}>Based on figures logged so far</div>
        </div>
        <div className={`tax-total-val ${balance >= 0 ? '' : 'danger'}`} style={{color: balance >= 0 ? 'var(--teal)' : 'var(--danger)'}}>{fmt(Math.abs(balance))}</div>
      </div>

      <div className="note" style={{marginTop:20}}>
        This is an estimate only and does not constitute tax advice. Always confirm your final figures with a qualified accountant or HMRC. Making Tax Digital (MTD) for Income Tax applies from April 2027 for earnings over £30,000.
      </div>

      {isElite && (
        <div style={{marginTop:20}}>
          <button className="btn btn-ghost">📄 Export MTD-Ready Report</button>
          <button className="btn btn-ghost" style={{marginLeft:10}}>📥 Download CSV</button>
        </div>
      )}
      {isPro && !isElite && (
        <div style={{marginTop:20}}>
          <button className="btn btn-ghost">📥 Download CSV</button>
        </div>
      )}
    </div>
  );
}

                  <button className="btn btn-ghost btn-sm" onClick={() => setEditing(false)}>Cancel</button>
                </div>
              </>
            ) : (
              <>
                <div className="profile-field"><span className="profile-field-label">Name</span><span className="profile-field-val">{profile?.name || '—'}</span></div>
                <div className="profile-field"><span className="profile-field-label">Trade</span><span className="profile-field-val">{profile?.trade || '—'}</span></div>
                <div className="profile-field"><span className="profile-field-label">UTR Number</span><span className="profile-field-val">{profile?.utr ? '••••••' + profile.utr.slice(-4) : '—'}</span></div>
                <div className="profile-field"><span className="profile-field-label">Current Plan</span><span className="plan-badge">{profile?.plan || 'Free'}</span></div>
                <button className="btn btn-ghost btn-sm" style={{marginTop:12}} onClick={() => setEditing(true)}>Edit Details</button>
              </>
            )}
          </div>
          <div className="divider" />
          <div className="profile-section">
            <h3>Account</h3>
            <div className="profile-field"><span className="profile-field-label">Email</span><span className="profile-field-val" style={{fontSize:'0.82rem'}}>{user.email}</span></div>
          </div>
          <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={onSignOut}>Sign out</button>
        </div>

        <div>
          <div style={{fontSize:'0.75rem',color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:14}}>Choose Your Plan</div>
          {plans.map(p => (
            <div key={p.name} className={`plan-card ${(profile?.plan||'Free') === p.name ? 'active' : ''}`}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                <span className="plan-name">{p.name}</span>
                <span className="plan-price">{p.price}</span>
              </div>
              <ul className="plan-features">
                {p.features.map(f => <li key={f}>{f}</li>)}
              </ul>
              {(profile?.plan||'Free') !== p.name && p.name !== 'Free' && (
                <button className="btn btn-teal btn-sm" style={{marginTop:12}}>Upgrade to {p.name}</button>
              )}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function App() {
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [page, setPage] = useState('dashboard');
  const [data, setData] = useState({ expenses: [], mileage: [], cis: [] });
  const [quickAdd, setQuickAdd] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    supabase.auth.getSession().then(({ data: { session } }) => {
      setSession(session);
      setLoading(false);
    });
    const { data: { subscription } } = supabase.auth.onAuthStateChange((_e, s) => {
      setSession(s);
    });
    return () => subscription.unsubscribe();
  }, []);

  const loadProfile = useCallback(async (uid) => {
    const { data } = await supabase.from('profiles').select('*').eq('id', uid).single();
    setProfile(data);
  }, []);

  const loadData = useCallback(async (uid) => {
    const [expRes, milRes, cisRes] = await Promise.all([
      supabase.from('expenses').select('*').eq('user_id', uid),
      supabase.from('mileage').select('*').eq('user_id', uid),
      supabase.from('cis_records').select('*').eq('user_id', uid),
    ]);
    setData({ expenses: expRes.data||[], mileage: milRes.data||[], cis: cisRes.data||[] });
  }, []);

  useEffect(() => {
    if (session?.user) {
      loadProfile(session.user.id);
      loadData(session.user.id);
    }
  }, [session, loadProfile, loadData]);

  const handleSignOut = async () => { await supabase.auth.signOut(); setSession(null); };

  const handleQuickAdd = (type) => {
    const map = { expense: 'expenses', mileage: 'mileage', cis: 'cis' };
    setPage(map[type]);
    setQuickAdd(type);
    setTimeout(() => setQuickAdd(null), 100);
  };

  if (loading) return <div className="loading">Loading…</div>;
  if (!session) return <AuthScreen onAuth={() => {}} />;

  const user = session.user;

  const navItems = [
    { id: 'dashboard', icon: '⊞', label: 'Dashboard' },
    { id: 'expenses', icon: '🧾', label: 'Expenses' },
    { id: 'mileage', icon: '🚐', label: 'Mileage' },
    { id: 'cis', icon: '🏗️', label: 'CIS' },
    { id: 'tax', icon: '📊', label: 'Tax' },
    { id: 'profile', icon: '⚙️', label: 'Profile' },
  ];

  const renderPage = () => {
    switch(page) {
      case 'dashboard': return <Dashboard user={user} profile={profile} data={data} onAdd={handleQuickAdd} />;
      case 'expenses': return <Expenses user={user} profile={profile} expenses={data.expenses} onRefresh={() => loadData(user.id)} initialModal={quickAdd==='expense'} />;
      case 'mileage': return <Mileage user={user} profile={profile} mileage={data.mileage} onRefresh={() => loadData(user.id)} initialModal={quickAdd==='mileage'} />;
      case 'cis': return <CISRecords user={user} profile={profile} cis={data.cis} onRefresh={() => loadData(user.id)} initialModal={quickAdd==='cis'} />;
      case 'tax': return <TaxSummary user={user} profile={profile} data={data} />;
      case 'profile': return <Profile user={user} profile={profile} onProfileUpdate={() => loadProfile(user.id)} onSignOut={handleSignOut} />;
      default: return null;
    }
  };

  return (
    <div className="app-layout">
      <nav className="sidebar">
        <div className="sidebar-logo">SQUARED <span>AWAY</span></div>
        {navItems.map(n => (
          <div key={n.id} className={`nav-item ${page===n.id?'active':''}`} onClick={() => setPage(n.id)}>
            <span className="nav-icon">{n.icon}</span> {n.label}
          </div>
        ))}
        <div className="sidebar-bottom">
          <div className="plan-badge">{profile?.plan || 'Free'}</div>
          <div className="sidebar-user">{user.email}</div>
          <button className="btn-signout" onClick={handleSignOut}>Sign out</button>
        </div>
      </nav>

      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>
        <div className="mobile-header">
          <span className="mobile-header-logo">SQUARED <span style={{color:'var(--teal)'}}>AWAY</span></span>
          <span className="plan-badge">{profile?.plan || 'Free'}</span>
        </div>
        <main className="main-content">{renderPage()}</main>
      </div>

      <nav className="mobile-nav">
        <div className="mobile-nav-items">
          {navItems.map(n => (
            <button key={n.id} className={`mobile-nav-item ${page===n.id?'active':''}`} onClick={() => setPage(n.id)}>
              <span className="icon">{n.icon}</span>{n.label}
            </button>
          ))}
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
